<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic.js Unit Tests</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            background: #f9fafb;
            color: #111827;
        }

        h1 {
            color: #4f46e5;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 0.5rem;
        }

        .summary {
            display: flex;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .stat {
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1.25rem;
        }

        .stat-total {
            background: #e5e7eb;
            color: #374151;
        }

        .stat-passed {
            background: #d1fae5;
            color: #065f46;
        }

        .stat-failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .result-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .result-item {
            padding: 0.75rem 1rem;
            margin: 0.25rem 0;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            border-left: 4px solid;
        }

        .result-pass {
            background: #f0fdf4;
            border-color: #22c55e;
            color: #166534;
        }

        .result-fail {
            background: #fef2f2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .result-details {
            font-size: 0.75rem;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 0.25rem;
            font-family: monospace;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover {
            background: #4338ca;
        }

        #loading {
            color: #6b7280;
            font-style: italic;
        }

        .all-pass {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            margin: 1rem 0;
        }
    </style>
</head>

<body>
    <h1>🧪 Logic.js Unit Tests</h1>

    <button onclick="runTests()">Run Tests</button>

    <div id="loading" style="display: none;">Running tests...</div>

    <div id="results"></div>

    <!-- Load the logic module first -->
    <script src="logic.js"></script>

    <!-- Load the test suite -->
    <script src="logic.test.js"></script>

    <script>
        function runTests() {
            const loading = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');

            loading.style.display = 'block';
            resultsDiv.innerHTML = '';

            // Run after a brief delay to show loading state
            setTimeout(() => {
                try {
                    const summary = runAllTests();
                    displayResults(summary);
                } catch (error) {
                    // Safe DOM construction to prevent XSS
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'result-fail result-item';
                    
                    const strongEl = document.createElement('strong');
                    strongEl.textContent = 'Error running tests: ';
                    errorDiv.appendChild(strongEl);
                    
                    const msgText = document.createTextNode(error.message || 'Unknown error');
                    errorDiv.appendChild(msgText);
                    
                    const detailsDiv = document.createElement('div');
                    detailsDiv.className = 'result-details';
                    detailsDiv.textContent = error.stack || '';
                    errorDiv.appendChild(detailsDiv);
                    
                    resultsDiv.innerHTML = '';
                    resultsDiv.appendChild(errorDiv);
                }
                loading.style.display = 'none';
            }, 100);
        }

        function displayResults(summary) {
            const resultsDiv = document.getElementById('results');

            let html = `
                <div class="summary">
                    <div class="stat stat-total">Total: ${summary.total}</div>
                    <div class="stat stat-passed">✓ Passed: ${summary.passed}</div>
                    <div class="stat stat-failed">✗ Failed: ${summary.failed}</div>
                </div>
            `;

            if (summary.failed === 0 && summary.passed > 0) {
                html += `<div class="all-pass">✅ All ${summary.passed} tests passed!</div>`;
            }

            // Show failures first
            const failures = summary.results.filter(r => !r.pass);
            const passes = summary.results.filter(r => r.pass);

            if (failures.length > 0) {
                html += `<h3 style="color: #dc2626;">Failed Tests (${failures.length})</h3>`;
                html += '<ul class="result-list">';
                failures.forEach(result => {
                    html += `
                        <li class="result-item result-fail">
                            ✗ ${result.message}
                            <div class="result-details">
                                Expected: ${JSON.stringify(result.expected)}<br>
                                Actual: ${JSON.stringify(result.actual)}
                                ${result.diff !== undefined ? `<br>Diff: ${result.diff}` : ''}
                            </div>
                        </li>
                    `;
                });
                html += '</ul>';
            }

            html += `<h3 style="color: #16a34a;">Passed Tests (${passes.length})</h3>`;
            html += '<ul class="result-list">';
            passes.forEach(result => {
                html += `<li class="result-item result-pass">✓ ${result.message}</li>`;
            });
            html += '</ul>';

            resultsDiv.innerHTML = html;
        }

        // Auto-run on page load
        window.addEventListener('load', () => {
            setTimeout(runTests, 300);
        });
    </script>
</body>

</html>
